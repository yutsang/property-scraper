version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  simple:
    format: "%(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout

loggers:
  kedro:
    level: WARNING
    handlers: [console]
    propagate: false
  
  kedro.framework:
    level: WARNING
    handlers: [console]
    propagate: false
    
  kedro.io:
    level: WARNING
    handlers: [console]
    propagate: false
    
  kedro.runner:
    level: WARNING
    handlers: [console]
    propagate: false
    
  property_scraper:
    level: INFO
    handlers: [console]
    propagate: false
    
  # Root logger
  "":
    level: INFO
    handlers: [console]
    propagate: false 